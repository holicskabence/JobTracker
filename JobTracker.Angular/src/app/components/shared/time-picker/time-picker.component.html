<div class="tp">

    <button type="button" class="input-base input-base--trigger time-picker-trigger" [class.time-picker-trigger--filled]="!!value"
        [class.input-base--open]="isOpen" (click)="toggle($event)">
        <app-icon name="clock" class="time-picker-icon" [size]="15" />
        <span class="time-picker-label">{{ value ? formatted : (placeholder | translate) }}</span>
        <app-icon name="chevron-down" class="time-picker-chevron" [size]="14" />
    </button>

    @if (isOpen) {
    <div class="time-picker-panel" [style.top]="openUpward ? null : panelTop + 'px'"
        [style.bottom]="openUpward ? panelBottom + 'px' : null" [style.left.px]="panelLeft"
        (click)="$event.stopPropagation()">

        <div class="time-picker-columns">

            <div class="time-picker-column">
                <div class="time-picker-column-header">{{ 'shared.dateTimePicker.hourColumnHeader' | translate }}</div>
                <div class="time-picker-scroll" #hourList>
                    @for (h of hours; track h) {
                    <button type="button" class="time-picker-item" [class.time-picker-item--selected]="h === selectedHour"
                        (click)="pickHour(h, $event)">{{ h }}</button>
                    }
                </div>
            </div>

            <div class="time-picker-separator"></div>

            <div class="time-picker-column">
                <div class="time-picker-column-header">{{ 'shared.dateTimePicker.minuteColumnHeader' | translate }}</div>
                <div class="time-picker-minutes">
                    @for (m of minutes; track m) {
                    <button type="button" class="time-picker-item" [class.time-picker-item--selected]="m === selectedMinute"
                        (click)="pickMinute(m, $event)">{{ m }}</button>
                    }
                </div>
            </div>

        </div>

        <div class="time-picker-footer">
            <button type="button" class="time-picker-clear" (click)="clear($event)">
                <app-icon name="close" [size]="12" />
                {{ 'shared.dateTimePicker.allDay' | translate }}
            </button>
        </div>

    </div>
    }

</div>
