<div class="dp">

    <button type="button" class="date-picker-trigger" [class.date-picker-trigger--filled]="!!value"
        [class.date-picker-trigger--error]="hasError" [class.date-picker-trigger--open]="isOpen"
        (click)="toggle($event)">
        <app-icon name="calendar" class="date-picker-icon" [size]="15" />
        <span class="date-picker-label">{{ value ? formatted : (placeholder | translate) }}</span>
        <app-icon name="chevron-down" class="date-picker-chevron" [size]="14" />
    </button>

    @if (isOpen) {
    <div class="date-picker-panel" [style.top]="openUpward ? null : panelTop + 'px'"
        [style.bottom]="openUpward ? panelBottom + 'px' : null" [style.left.px]="panelLeft"
        (click)="$event.stopPropagation()">

        <div class="date-picker-header">
            <button type="button" class="date-picker-nav" (click)="prevMonth()">
                <app-icon name="chevron-left" [size]="15" />
            </button>
            <span class="date-picker-month-label">{{ monthLabel(viewMonth()) | translate }} {{ viewYear() }}</span>
            <button type="button" class="date-picker-nav" (click)="nextMonth()">
                <app-icon name="chevron-right" [size]="15" />
            </button>
        </div>

        <div class="date-picker-weekdays">
            @for (weekday of WEEKDAY_KEYS; track weekday) {
            <span class="date-picker-weekday">{{ weekday | translate }}</span>
            }
        </div>

        <div class="date-picker-grid">
            @for (day of calendarDays(); track $index) {
            @if (day) {
            <button type="button" class="date-picker-day" [class.date-picker-day--today]="isToday(day)"
                [class.date-picker-day--selected]="isSelected(day)" (click)="pick(day, $event)">{{ day }}</button>
            } @else {
            <span class="date-picker-day-empty"></span>
            }
            }
        </div>

    </div>
    }

</div>
