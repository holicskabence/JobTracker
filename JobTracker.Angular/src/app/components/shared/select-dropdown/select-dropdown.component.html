<button type="button" class="input-base input-base--trigger select-dropdown-trigger" [class.input-base--open]="isOpen"
    (click)="toggle($event)">
    <span class="select-dropdown-value">{{ value || (placeholder | translate) }}</span>
    <app-icon name="chevron-down" class="select-dropdown-chevron" [class.select-dropdown-chevron--open]="isOpen" [size]="14" />
</button>

@if (isOpen) {
<div class="select-dropdown-panel" [style.top.px]="panelTop" [style.left.px]="panelLeft"
    [style.min-width.px]="panelWidth" (click)="$event.stopPropagation()">
    @for (option of options; track option) {
    <button type="button" class="select-dropdown-option" [class.select-dropdown-option--active]="option === value"
        (click)="pick(option, $event)">
        <span>{{ option }}</span>
        @if (option === value) {
        <app-icon name="check" [size]="13" />
        }
    </button>
    }
</div>
}
