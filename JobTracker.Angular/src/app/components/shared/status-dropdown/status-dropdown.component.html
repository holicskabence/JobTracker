<div class="sd" [class.status-dropdown--form]="variant === 'form'">
    @if (variant === 'dots') {
    <button type="button" class="status-dropdown-trigger status-dropdown-trigger--dots"
        [class.status-dropdown-trigger--open]="isOpen" (click)="toggle($event)" [attr.title]="'shared.statusDropdown.changeStatusTitle' | translate">
        <app-icon name="more-vertical" [size]="15" />
    </button>
    }
    @if (variant === 'form') {
    <button type="button" class="status-dropdown-trigger status-dropdown-trigger--form"
        [class.status-dropdown-trigger--open]="isOpen" (click)="toggle($event)">
        <span class="status-dropdown-form-dot" [style.background-color]="colorFor(value)"></span>
        <span class="status-dropdown-form-label">{{ labelFor(value) }}</span>
        <app-icon name="chevron-down" class="status-dropdown-form-chevron" [size]="16" />
    </button>
    }
    @if (isOpen) {
    <div class="status-dropdown-panel" [style.top.px]="panelTop" [style.bottom.px]="panelBottom" [style.left.px]="panelLeft"
        [style.width.px]="panelWidth" [style.max-height.px]="panelMaxHeight" (click)="$event.stopPropagation()">
        @for (option of options(); track option.key) {
        <button type="button" class="status-dropdown-option" [class.status-dropdown-option--current]="option.key === value"
            (click)="pick(option.key, $event)">
            <span class="status-dropdown-dot" [style.background-color]="option.color"></span>
            <span class="status-dropdown-name">{{ option.label }}</span>
            @if (option.key === value) {
            <app-icon name="check" class="status-dropdown-check" [size]="13" />
            }
        </button>
        }
    </div>
    }
</div>
