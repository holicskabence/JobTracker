<app-card class="card" [class.card--selected]="isSelected" [class.card--dragging]="isDragging" draggable="true"
  (dragstart)="onDragStart($event)" (dragend)="onDragEnd()" (click)="onCardClick()">

  <div class="card-menu" (click)="$event.stopPropagation()">
    <app-job-card-menu [job]="job" />
  </div>

  <h5 class="card-company">{{ job.company }}</h5>
  <p class="card-position">{{ job.position }}</p>

  @if (job.source) {
  <span class="card-source">{{ job.source }}</span>
  }

  <div class="card-footer">
    <div class="card-date">
      <app-icon name="clock" [size]="13" />
      {{ job.date }}
    </div>

    <div class="card-actions" (click)="$event.stopPropagation()">
      <!-- Edit button -->
      <button class="card-action-button" [title]="'shared.jobCard.edit' | translate" (click)="onEditClick($event)">
        <app-icon name="edit" [size]="12" />
      </button>

      @if (job.link) {
      <a class="card-action-button" [href]="safeLink(job.link)" target="_blank" rel="noreferrer"
        [title]="'shared.jobCard.open' | translate" (click)="$event.stopPropagation()">
        <app-icon name="link" [size]="12" [strokeWidth]="2.5" />
      </a>
      }
    </div>
  </div>

</app-card>
