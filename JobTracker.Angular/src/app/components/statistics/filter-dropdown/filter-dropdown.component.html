<button type="button" class="filter-dropdown-trigger" [class.filter-dropdown-trigger--open]="isOpen()"
  [class.filter-dropdown-trigger--active]="active" (click)="toggle()">
  @if (leadingIcon === 'calendar') {
  <svg class="filter-dropdown-leading-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
    <line x1="16" y1="2" x2="16" y2="6" />
    <line x1="8" y1="2" x2="8" y2="6" />
    <line x1="3" y1="10" x2="21" y2="10" />
  </svg>
  }
  <span class="filter-dropdown-label">{{ label }}</span>
  <svg class="filter-dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9" />
  </svg>
</button>

@if (isOpen()) {
<div class="filter-dropdown-panel" [class.filter-dropdown-panel--right]="panelAlign === 'right'">
  <ng-content></ng-content>
</div>
}
