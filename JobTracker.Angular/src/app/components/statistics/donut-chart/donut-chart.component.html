<div class="donut-wrap">
  <div class="donut-svg-wrap">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="donut-svg">
      @if (renderedSlices.length) {
      @for (slice of renderedSlices; track slice.key) {
      <path [attr.d]="slice.path" [attr.fill]="slice.color" class="slice"
        [class.slice--active]="hoveredKey() === slice.key"
        (mouseenter)="hoverSlice(slice.key)" (mouseleave)="clearHover()" />
      }
      } @else {
      <circle cx="100" cy="100" [attr.r]="(OUTER_RADIUS + INNER_RADIUS) / 2" fill="none"
        [attr.stroke-width]="OUTER_RADIUS - INNER_RADIUS" stroke="var(--clr-border)" />
      }
    </svg>

    <div class="donut-center">
      <span class="donut-center-value">{{ centerValue }}</span>
      <span class="donut-center-label">{{ centerCaption }}</span>
    </div>
  </div>

  @if (renderedSlices.length) {
  <div class="donut-legend">
    @for (slice of renderedSlices; track slice.key) {
    <div class="donut-legend-item" [class.donut-legend-item--active]="hoveredKey() === slice.key"
      (mouseenter)="hoverSlice(slice.key)" (mouseleave)="clearHover()">
      <span class="donut-legend-dot" [style.background-color]="slice.color"></span>
      <span class="donut-legend-name">{{ slice.label }}</span>
      <span class="donut-legend-value">{{ slice.value }}</span>
      <span class="donut-legend-percent">({{ slice.percent }}%)</span>
    </div>
    }
  </div>
  }
</div>
