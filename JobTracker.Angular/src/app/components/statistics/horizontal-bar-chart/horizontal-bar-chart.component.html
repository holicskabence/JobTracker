<div class="hbar-wrap">
  @if (!rows.length) {
  <app-empty-state [message]="'statistics.emptyState.noApplications' | translate"></app-empty-state>
  } @else {
  @for (row of rows; track row.label; let i = $index) {
  <div class="hbar-row" [style.animation-delay.ms]="i * 60">
    <span class="hbar-label">{{ row.label }}</span>
    <div class="hbar-track">
      <div class="hbar-fill" [style.width.%]="row.widthPercent" [style.background-color]="row.color"></div>
    </div>
    <span class="hbar-value">{{ row.value }}{{ valueSuffix }}</span>
    @if (showPercent) {
    <span class="hbar-percent">({{ row.percent }}%)</span>
    }
  </div>
  }
  }
</div>
