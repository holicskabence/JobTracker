<svg viewBox="0 0 100 58" aria-hidden="true">
  <defs>
    <linearGradient id="gauge-graphic-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5E27C" />
      <stop offset="1" stop-color="#4CAF24" />
    </linearGradient>
  </defs>
  <path class="gauge-graphic-track" [attr.d]="arcPath" fill="none" stroke-linecap="round" />
  <path class="gauge-graphic-arc" data-animate="analytics-gauge-arc" [attr.d]="arcPath" fill="none"
    stroke="url(#gauge-graphic-gradient)" stroke-linecap="round" stroke-dasharray="93 129" />
</svg>
