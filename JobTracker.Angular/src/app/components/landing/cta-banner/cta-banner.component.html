<section class="landing-cta-banner-section">
    <div class="landing-cta-banner-container">
        <div class="landing-cta-banner">

            <img class="landing-cta-banner-rocket" src="/assets/landing/cta-rocket.png" alt="" />

            <div class="landing-cta-banner-copy">
                <h2 class="landing-cta-banner-headline">{{ 'landing.cta.headline' | translate }}</h2>
                <p class="landing-cta-banner-paragraph">{{ 'landing.cta.paragraph' | translate }}</p>
            </div>

            <div class="landing-cta-banner-actions">
                <a class="landing-cta-banner-primary-button" routerLink="/register">{{ 'landing.cta.ctaPrimary' | translate }}</a>
                <a class="landing-cta-banner-secondary-button" routerLink="/login">{{ 'landing.cta.ctaSecondary' | translate }}</a>
            </div>

        </div>
    </div>
</section>
