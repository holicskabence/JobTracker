<section class="landing-dashboard-preview" id="dashboard-preview" data-section="dashboard-preview">
    <div class="landing-dashboard-preview-inner">

        <div class="landing-dashboard-preview-copy" data-animate="dashboard-copy">
            <h2 class="landing-dashboard-preview-headline" data-animate="dashboard-headline">{{ 'landing.dashboard.headline' | translate }}</h2>
            <p class="landing-dashboard-preview-paragraph" data-animate="dashboard-paragraph">{{ 'landing.dashboard.paragraph' | translate }}</p>

            <div class="landing-dashboard-preview-cta-row">
                <a class="landing-dashboard-preview-cta" data-animate="dashboard-cta" [routerLink]="ctaLink()">
                    {{ 'landing.dashboard.cta' | translate }}
                </a>

                <svg class="landing-dashboard-preview-doodle-arrow" viewBox="0 0 70 34" aria-hidden="true">
                    <path data-animate="dashboard-arrow-curve" d="M4 6 C 20 26, 42 28, 60 16" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" />
                    <path data-animate="dashboard-arrow-head" d="M60 16 l-8 -1 M60 16 l-4.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <div class="landing-dashboard-preview-visual" data-animate="dashboard-frame">
            <img class="landing-dashboard-preview-shot" data-animate="dashboard-mockup"
                src="/assets/landing/overview.png" [alt]="'landing.dashboard.previewAlt' | translate" />
        </div>
    </div>
</section>
