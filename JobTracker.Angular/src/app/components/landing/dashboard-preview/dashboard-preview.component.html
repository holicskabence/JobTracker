<section class="landing-v2-dashboard-preview" id="dashboard-preview">
    <div class="landing-v2-dashboard-preview-inner">

        <div class="landing-v2-dashboard-preview-copy">
            <h2 class="landing-v2-dashboard-preview-headline">{{ 'landingV2.dashboard.headline' | translate }}</h2>
            <p class="landing-v2-dashboard-preview-paragraph">{{ 'landingV2.dashboard.paragraph' | translate }}</p>

            <div class="landing-v2-dashboard-preview-cta-row">
                <a class="landing-v2-dashboard-preview-cta" routerLink="/register">
                    {{ 'landingV2.dashboard.cta' | translate }}
                    <svg viewBox="0 0 24 24">
                        <path d="M4 12h15M13.5 5.5L20 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>

                <svg class="landing-v2-dashboard-preview-doodle-arrow" viewBox="0 0 70 34" aria-hidden="true">
                    <path d="M4 6 C 20 26, 42 28, 60 16" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" />
                    <path d="M60 16 l-8 -1 M60 16 l-4.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <div class="landing-v2-dashboard-preview-visual">
            <app-landing-v2-dashboard-mockup></app-landing-v2-dashboard-mockup>
        </div>
    </div>
</section>
