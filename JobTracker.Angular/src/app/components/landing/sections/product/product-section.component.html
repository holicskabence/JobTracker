<section class="product-section" id="product">
    <div class="product-copy">
        <p class="product-eyebrow">{{ 'landing.story.product.eyebrow' | translate }}</p>
        <h2 class="product-headline">{{ 'landing.story.product.headline' | translate }}</h2>
        <p class="product-copy-text">{{ 'landing.story.product.subtitle' | translate }}</p>
    </div>

    <div class="product-stage" aria-hidden="true">
        <div class="product-frame">
            <div class="product-frame-top">
                <span class="product-frame-dot product-frame-dot--red"></span>
                <span class="product-frame-dot product-frame-dot--yellow"></span>
                <span class="product-frame-dot product-frame-dot--green"></span>
                <span class="product-frame-url">jobtracker.app/dashboard/overview</span>
            </div>
            <div class="product-frame-body">
                <aside class="product-sidebar">
                    <span class="product-sidebar-icon product-sidebar-icon--active"></span>
                    <span class="product-sidebar-icon"></span>
                    <span class="product-sidebar-icon"></span>
                    <span class="product-sidebar-icon"></span>
                    <span class="product-sidebar-icon"></span>
                    <span class="product-sidebar-icon"></span>
                </aside>
                <main class="product-main">
                    <div class="product-stats-row">
                        <div class="product-stat">
                            <span class="product-stat-label">Total applications</span>
                            <span class="product-stat-value">86</span>
                        </div>
                        <div class="product-stat">
                            <span class="product-stat-label">Active</span>
                            <span class="product-stat-value">29</span>
                        </div>
                        <div class="product-stat">
                            <span class="product-stat-label">Response rate</span>
                            <span class="product-stat-value product-stat-value--accent">15%</span>
                        </div>
                        <div class="product-stat">
                            <span class="product-stat-label">Interviews</span>
                            <span class="product-stat-value">9</span>
                        </div>
                    </div>
                    <div class="product-panels">
                        <div class="product-panel">
                            <span class="product-panel-title">Upcoming interviews</span>
                            <div class="product-list-row">
                                <span class="product-list-avatar"></span>
                                <span class="product-list-line"></span>
                                <span class="product-list-date">Jul 27</span>
                            </div>
                            <div class="product-list-row">
                                <span class="product-list-avatar"></span>
                                <span class="product-list-line"></span>
                                <span class="product-list-date">Jul 29</span>
                            </div>
                        </div>
                        <div class="product-panel">
                            <span class="product-panel-title">Quick tasks</span>
                            <div class="product-task-row">
                                <span class="product-task-check"></span>
                                <span class="product-list-line"></span>
                            </div>
                            <div class="product-task-row">
                                <span class="product-task-check product-task-check--done"></span>
                                <span class="product-list-line"></span>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
</section>
