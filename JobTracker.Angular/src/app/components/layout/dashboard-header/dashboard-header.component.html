<header class="dh">

    <div class="dh-brand">
        <div class="dh-brand-logo">
            <app-icon name="logo-mark" [size]="20" />
        </div>
        <span class="dh-brand-name">JobTracker</span>

        <button class="dh-sidebar-toggle" (click)="toggleSidebar.emit()"
            [title]="sidebarCollapsed ? ('sidebar.expand' | translate) : ('sidebar.collapse' | translate)">
            <app-icon name="chevron-right" [class.dh-sidebar-toggle-icon--expanded]="!sidebarCollapsed" [size]="14" />
        </button>
    </div>

    <button class="header-hamburger" (click)="openMobileMenu.emit()" [attr.aria-label]="'header.openMenu' | translate">
        <app-icon name="menu" [size]="20" />
    </button>

    <h1 class="header-title">{{ pageTitle }}</h1>

    <div class="header-right">
        <button class="header-add-button" (click)="addJob.emit()">
            <app-icon name="plus" [size]="16" />
            <span class="header-add-label">{{ addButtonLabelKey | translate }}</span>
        </button>
    </div>

</header>
