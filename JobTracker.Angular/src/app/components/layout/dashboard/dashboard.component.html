<div class="page">

    @if (initialLoading()) {
    <div class="dashboard-loading" role="status" [attr.aria-label]="'common.loading' | translate">
        <app-icon name="spinner" class="dashboard-loading-spinner" [size]="32" />
    </div>
    } @else {

    <app-dashboard-header [activeTab]="activeTab()" [userName]="auth.currentUser()?.name ?? ''"
        [sidebarCollapsed]="sidebarCollapsed()" (toggleSidebar)="sidebarCollapsed.set(!sidebarCollapsed())"
        (addJob)="handleHeaderAdd()" (openMobileMenu)="sidebarMobileOpen.set(true)" />

    <div class="panel">

        <app-sidebar [activeTab]="activeTab()" [collapsed]="sidebarCollapsed()" [mobileOpen]="sidebarMobileOpen()"
            [userName]="auth.currentUser()?.name ?? ''" [userEmail]="auth.currentUser()?.email ?? ''"
            [avatarUrl]="auth.avatarObjectUrl()"
            (closeMobile)="sidebarMobileOpen.set(false)" (logout)="logout()" />

        <div class="content">
            <main class="content-body"
                [class.content-body--kanban]="activeTab() === 'applications' && viewService.view() === 'kanban'"
                [class.content-body--table]="activeTab() === 'applications' && viewService.view() !== 'kanban'">
                <router-outlet (activate)="onRouteActivate($event)" />
            </main>
        </div>

    </div>

    @if (modalOpen()) {
    <app-add-job-modal [editJob]="editingJob()" (close)="closeModal()" />
    }

    @if (historyJob(); as job) {
    <app-job-history-modal [job]="job" (close)="closeHistory()" />
    }

    }

</div>
