<div class="page">

    <div class="panel">

        <app-sidebar [activeTab]="activeTab()" [collapsed]="sidebarCollapsed()" [mobileOpen]="sidebarMobileOpen()"
            [userName]="auth.currentUser()?.name ?? ''" [userEmail]="auth.currentUser()?.email ?? ''"
            [avatarUrl]="auth.avatarObjectUrl()" (toggleCollapsed)="sidebarCollapsed.set(!sidebarCollapsed())"
            (closeMobile)="sidebarMobileOpen.set(false)" (logout)="logout()" />

        <div class="content">
            <app-dashboard-header [activeTab]="activeTab()" [userName]="auth.currentUser()?.name ?? ''"
                (addJob)="handleHeaderAdd()" (openMobileMenu)="sidebarMobileOpen.set(true)" />

            <main class="content-body"
                [class.content-body--kanban]="activeTab() === 'jelentkezesek' && viewService.view() === 'kanban'"
                [class.content-body--table]="activeTab() === 'jelentkezesek' && viewService.view() === 'table'">
                @if (initialLoading()) {
                <div class="dashboard-loading">
                    <svg class="dashboard-loading-spinner" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    </svg>
                </div>
                } @else {
                <router-outlet (activate)="onRouteActivate($event)" />
                }
            </main>
        </div>

    </div>

    @if (modalOpen()) {
    <app-add-job-modal [editJob]="editingJob()" (close)="closeModal()" />
    }

</div>
